let currentSection = "daily";

function updateBalance() {

    document
        .getElementById("coins")
        .textContent =
        Number(coins).toLocaleString();

    const usd =
        Number(coins) / 1000000;

    document
        .getElementById("usdValue")
        .textContent =
        "≈ $" + usd.toFixed(6);

}

function detectLanguage() {

    if (!user) {
        return "en";
    }

    const code =
        (
            user.language_code ||
            ""
        ).toLowerCase();

    if (
        code === "fa" ||
        code.startsWith("fa-")
    ) {

        return "fa";

    }

    if (
        code === "ar" ||
        code.startsWith("ar-")
    ) {

        return "ar";

    }

    return "en";

}

function getLanguage() {

    return (
        localStorage.getItem("language") ||
        detectLanguage()
    );

}
    function applyLanguage(lang) {

    if (!translations[lang]) {
        lang = "en";
    }

    const t = translations[lang];

    document.documentElement.lang = lang;

    document.documentElement.dir =
        lang === "en" ? "ltr" : "rtl";

    document.getElementById(
        "balanceTitle"
    ).textContent = t.balance;

    document
        .querySelectorAll("[data-key]")
        .forEach(function(element) {

            const key =
                element.getAttribute("data-key");

            if (t[key]) {
                element.textContent = t[key];
            }

        });

    document.getElementById(
        "languageButton"
    ).textContent = {

        en: "🌐 EN",
        fa: "🌐 FA",
        ar: "🌐 AR"

    }[lang];

    document.getElementById(
        "rewardButton"
    ).textContent = t.claim;

    document.getElementById(
        "adsWatchedLabel"
    ).textContent = t.adsWatched;

    document.getElementById(
        "adsRemainingLabel"
    ).textContent = t.adsRemaining;

    document.getElementById(
        "adsRewardLabel"
    ).textContent = t.adsReward;

    document.getElementById(
        "watchAdButton"
    ).textContent = t.watchAd;

    showSection(
        currentSection,
        document.querySelector(".nav-button.active")
    );

}


/* =====================================================
   CHANGE LANGUAGE
===================================================== */

function changeLanguage(lang) {

    if (!translations[lang]) {
        lang = "en";
    }

    localStorage.setItem(
        "language",
        lang
    );

    applyLanguage(lang);

    document
        .getElementById("languageMenu")
        .classList.remove("show");

}


/* =====================================================
   LANGUAGE MENU
===================================================== */

function toggleLanguageMenu() {

    document
        .getElementById("languageMenu")
        .classList.toggle("show");

}


document.addEventListener(
    "click",
    function(event) {

        const menu =
            document.getElementById(
                "languageMenu"
            );

        const button =
            document.getElementById(
                "languageButton"
            );

        if (
            !menu.contains(event.target) &&
            !button.contains(event.target)
        ) {

            menu.classList.remove("show");

        }

    }
);


/* =====================================================
   SHOW SECTION
===================================================== */

function showSection(
    section,
    button
) {

    currentSection = section;

    document
        .querySelectorAll(".nav-button")
        .forEach(function(btn) {

            btn.classList.remove("active");

        });

    if (button) {
        button.classList.add("active");

/* =====================================================
   DAILY REWARD CHECK
===================================================== */

async function checkDailyReward() {

    if (!user) {
        return;
    }

    try {

        const response =
            await fetch(
                "/api/user/" +
                encodeURIComponent(user.id)
            );

        const data =
            await response.json();

        if (
            !data.success ||
            !data.user
        ) {

            return;

        }

        const lastReward =
            data.user.last_daily_reward;

        const button =
            document.getElementById(
                "rewardButton"
            );

        const status =
            document.getElementById(
                "rewardStatus"
            );

        const t =
            translations[getLanguage()];


        if (!lastReward) {

            button.disabled = false;

            button.textContent =
                t.claim;

            status.textContent = "";

            return;

        }


        const lastTime =
            new Date(lastReward).getTime();

        const nextTime =
            lastTime +
            (12 * 60 * 60 * 1000);

        const now =
            Date.now();


        if (now >= nextTime) {

            button.disabled = false;

            button.textContent =
                t.claim;

            status.textContent = "";

            return;

        }


        button.disabled = true;

        button.textContent =
            t.claimed;

        updateWaitingTime(
            nextTime
        );

    } catch (error) {

        console.error(
            "Daily reward check error:",
            error
        );

    }

}


/* =====================================================
   DAILY WAITING TIME
===================================================== */

function updateWaitingTime(nextTime) {

    const status =
        document.getElementById(
            "rewardStatus"
        );

    const t =
        translations[getLanguage()];

    function update() {

        const remaining =
            nextTime -
            Date.now();

        if (remaining <= 0) {

            checkDailyReward();

            return;

        }

        const totalMinutes =
            Math.ceil(
                remaining / 60000
            );

        const hours =
            Math.floor(
                totalMinutes / 60
            );

        const minutes =
            totalMinutes % 60;

        status.className =
            "reward-status reward-waiting";

        status.textContent =
            t.waiting +
            " " +
            hours +
            "h " +
            minutes +
            "m";

    }

    update();

    setTimeout(
        function() {

            checkDailyReward();

        },
        60000
    );

}

===================================================== */

function createAdsGramTask() {

    const list =
        document.getElementById(
            "tasksList"
        );

    const message =
        document.getElementById(
            "taskMessage"
        );

    const t =
        translations[getLanguage()];

    list.innerHTML = "";

    /*
     * =========================================
     * ADSGRAM TASK
     * =========================================
     */

    const task =
        document.createElement(
            "adsgram-task"
        );

    task.setAttribute(
        "data-block-id",
        "task-44183"
    );

    task.setAttribute(
        "data-debug",
        "false"
    );

    task.setAttribute(
        "data-debug-console",
        "false"
    );

    task.className =
        "adsgram-task";


    /*
     * =========================================
     * REWARD
     * =========================================
     */

    const reward =
        document.createElement(
            "div"
        );

    reward.setAttribute(
        "slot",
        "reward"
    );

    reward.className =
        "task-adsgram-reward";

    reward.textContent =
        "🪙 1000 coins";


    /*
     * =========================================
     * BUTTON
     * =========================================
     */

    const button =
        document.createElement(
            "div"
        );

    button.setAttribute(
        "slot",
        "button"
    );

    button.className =
        "task-adsgram-button";

    button.textContent =
        t.completeTask;


    /*
     * =========================================
     * CLAIM
     * =========================================
     */

    const claim =
        document.createElement(
            "div"
        );

    claim.setAttribute(
        "slot",
        "claim"
    );

    claim.className =
        "task-adsgram-claim";

    claim.textContent =
        "⏳ Verifying...";


    /*
     * =========================================
     * DONE
     * =========================================
     */

    const done =
        document.createElement(
            "div"
        );

    done.setAttribute(
        "slot",
        "done"
    );

    done.className =
        "task-adsgram-done";

    done.textContent =
        "✅ Completed";


    /*
     * =========================================
     * ADD ELEMENTS
     * =========================================
     */

    task.appendChild(
        reward
    );

    task.appendChild(
        button
    );

    task.appendChild(
        claim
    );

    task.appendChild(
        done
    );

    list.appendChild(
        task
    );


    /*
     * =========================================
     * TASK COMPLETED
     * =========================================
     *
     * فقط وقتی AdsGram بگوید
     * Task واقعاً انجام شده است.
     */

    task.addEventListener(
        "reward",
        async function(event) {

            console.log(
                "AdsGram task reward:",
                event.detail
            );

            message.className =
                "task-message task-success";

            message.textContent =
                "⏳ Verifying task...";

            await claimAdsGramTask();

        }
    );


    /*
     * =========================================
     * NO TASK
     * =========================================
     */

    task.addEventListener(
        "onBannerNotFound",
        function(event) {

            console.log(
                "AdsGram: No task available",
                event.detail
            );

            list.innerHTML = "";

            message.className =
                "task-message";

            message.textContent =
                t.noTasks;
        }
    );


    /*
     * =========================================
     * ADSGRAM ERROR
     * =========================================
     */

    task.addEventListener(
        "onError",
        function(event) {

            console.error(
                "AdsGram task error:",
                event.detail
            );

            message.className =
                "task-message task-error";

            message.textContent =
                t.error;
        }
    );


    /*
     * =========================================
     * TOO LONG SESSION
     * =========================================
     */

    task.addEventListener(
        "onTooLongSession",
        function(event) {

            console.warn(
                "AdsGram session too long"
            );

            message.className =
                "task-message task-error";

            message.textContent =
                "Please restart the app and try again.";
        }
    );

}

/* =====================================================
   COMPLETE TASK
===================================================== */

async function completeTask(
    task,
    button
) {

    if (!user) {
        return;
    }


    if (!task || !task.id) {
        return;
    }


    const message =
        document.getElementById(
            "taskMessage"
        );

    const t =
        translations[getLanguage()];


    button.disabled = true;

    button.textContent =
        "⏳";


    try {

        const response =
            await fetch(
                "/api/tasks/claim",
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            telegram_id:
                                user.id,

                            task_id:
                                task.id

                        })

                }
            );


        const data =
            await response.json();


        if (data.success) {

            /*
             به‌روزرسانی موجودی
            */

            coins =
                Number(
                    data.user.coins
                );

            updateBalance();


            /*
             نمایش موفقیت
            */

            message.className =
                "task-message task-success";

            message.textContent =
                t.taskSuccess;


            /*
             حذف فوری تسک از صفحه
             */

            const card =
                button.closest(
                    ".task-card"
                );

            if (card) {

                card.remove();

            }


            /*
             اگر دیگر تسکی باقی نمانده
            */

            const list =
                document.getElementById(
                    "tasksList"
                );

            if (
                !list.children.length
            ) {

                message.textContent =
                    t.noTasks;

            }

        } else {

            button.disabled = false;

            button.textContent =
                t.completeTask;


            message.className =
                "task-message task-error";


            if (
                data.already_completed
            ) {

                message.textContent =
                    t.taskAlready;

                /*
                 اگر سرور بگوید قبلاً انجام شده،
                 آن تسک از صفحه حذف می‌شود.
                */

                const card =
                    button.closest(
                        ".task-card"
                    );

                if (card) {
                    card.remove();
                }

            } else {

                message.textContent =
                    data.message ||
                    t.error;

            }

        }

    } catch (error) {

        console.error(
            "Task claim error:",
            error
        );

        button.disabled = false;

        button.textContent =
            t.completeTask;

        message.className =
            "task-message task-error";

        message.textContent =
            t.error;

    }

}
