<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>EarnPool</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            font-family: Arial, sans-serif;
            background: #10131a;
            color: white;
        }

        body {
            padding-bottom: 88px;
        }

        button {
            font-family: inherit;
        }

        .app {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            padding: 15px;
        }


        /* =========================
           TOP BAR
        ========================= */

        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
        }

        .logo {
            font-size: 23px;
            font-weight: bold;
        }

        .language-button {
            border: none;
            background: #1c2330;
            color: white;
            border-radius: 10px;
            padding: 8px 11px;
            font-size: 13px;
            cursor: pointer;
        }


        /* =========================
           LANGUAGE MENU
        ========================= */

        .language-menu {
            display: none;
            position: absolute;
            top: 58px;
            right: 15px;
            background: #1c2330;
            border-radius: 12px;
            padding: 6px;
            z-index: 100;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.35);
        }

        .language-menu.show {
            display: block;
        }

        .language-option {
            display: block;
            width: 125px;
            border: none;
            background: transparent;
            color: white;
            padding: 10px;
            text-align: center;
            border-radius: 8px;
            cursor: pointer;
        }

        .language-option:active {
            background: #293242;
        }


        /* =========================
           BALANCE
        ========================= */

        .balance-card {
            background: #191e29;
            border-radius: 20px;
            padding: 22px;
            text-align: center;
            margin-bottom: 18px;
        }

        .balance-title {
            color: #9da5b4;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .coins {
            font-size: 30px;
            font-weight: bold;
        }

        .usd-value {
            margin-top: 6px;
            color: #8f98a8;
            font-size: 15px;
        }


        /* =========================
           MAIN CONTENT
        ========================= */

        .content-card {
            background: #191e29;
            border-radius: 20px;
            padding: 22px;
            min-height: 330px;
        }

        .content-icon {
            font-size: 42px;
            margin-bottom: 12px;
        }

        .content-title {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .content-text {
            color: #aeb5c1;
            line-height: 1.8;
            font-size: 15px;
        }


        /* =========================
           DAILY REWARD
        ========================= */

        .reward-button {
            width: 100%;
            border: none;
            background: #2d7dff;
            color: white;
            border-radius: 14px;
            padding: 14px;
            margin-top: 22px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .reward-button:active {
            transform: scale(0.98);
        }

        .reward-button:disabled {
            background: #303744;
            color: #8f98a8;
            cursor: not-allowed;
            transform: none;
        }

        .reward-status {
            text-align: center;
            margin-top: 14px;
            font-size: 14px;
            line-height: 1.6;
        }

        .reward-success {
            color: #58d68d;
        }

        .reward-waiting {
            color: #aeb5c1;
        }

        .reward-error {
            color: #ff7777;
        }


        /* =========================
           BOTTOM NAVIGATION
        ========================= */

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            width: 100%;
            background: #151922;
            border-top: 1px solid #252b36;
            padding: 7px 4px;
            z-index: 50;
        }

        .nav-container {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            display: flex;
            gap: 3px;
        }

        .nav-button {
            flex: 1;
            width: 16.666%;
            min-width: 0;
            border: none;
            background: transparent;
            color: #8f98a8;
            border-radius: 11px;
            padding: 6px 1px;
            cursor: pointer;
            font-size: 9px;
            line-height: 1.2;
        }

        .nav-button.active {
            background: #252d3b;
            color: white;
        }

        .nav-icon {
            display: block;
            font-size: 20px;
            line-height: 22px;
            margin-bottom: 3px;
        }


        /* =========================
           SMALL PHONES
        ========================= */

        @media (max-width: 360px) {

            .app {
                padding: 12px;
            }

            .nav-button {
                font-size: 8px;
                padding: 6px 0;
            }

            .nav-icon {
                font-size: 18px;
            }

            .logo {
                font-size: 21px;
            }

            .coins {
                font-size: 27px;
            }
        }

    </style>

</head>


<body>


<div class="app">


    <!-- TOP BAR -->

    <div class="top-bar">

        <div class="logo">
            EarnPool
        </div>

        <button
            class="language-button"
            id="languageButton"
            onclick="toggleLanguageMenu()"
        >
            🌐 EN
        </button>

    </div>


    <!-- LANGUAGE MENU -->

    <div
        class="language-menu"
        id="languageMenu"
    >

        <button
            class="language-option"
            onclick="changeLanguage('en')"
        >
            🇬🇧 English
        </button>

        <button
            class="language-option"
            onclick="changeLanguage('fa')"
        >
            🇦🇫 فارسی
        </button>

        <button
            class="language-option"
            onclick="changeLanguage('ar')"
        >
            🇸🇦 العربية
        </button>

    </div>


    <!-- BALANCE -->

    <div class="balance-card">

        <div
            class="balance-title"
            id="balanceTitle"
        >
            Your Balance
        </div>

        <div class="coins">

            <span id="coins">
                0
            </span>

            🪙

        </div>

        <div
            class="usd-value"
            id="usdValue"
        >
            ≈ $0.000000
        </div>

    </div>


    <!-- MAIN CONTENT -->

    <div class="content-card">

        <div
            class="content-icon"
            id="contentIcon"
        >
            🎁
        </div>

        <div
            class="content-title"
            id="contentTitle"
        >
            Daily Reward
        </div>

        <div
            class="content-text"
            id="contentText"
        >
            Claim your daily reward and earn coins every day.
        </div>

        <!-- DAILY REWARD BUTTON -->

        <button
            id="rewardButton"
            class="reward-button"
            onclick="claimDailyReward()"
        >
            🎁 Claim 1,000 Coins
        </button>

        <div
            id="rewardStatus"
            class="reward-status"
        ></div>

    </div>

</div>


<!-- BOTTOM NAVIGATION -->

<div class="bottom-nav">

    <div class="nav-container">


        <!-- DAILY -->

        <button
            class="nav-button active"
            data-section="daily"
            onclick="showSection('daily', this)"
        >

            <span class="nav-icon">
                🎁
            </span>

            <span data-key="daily">
                Daily
            </span>

        </button>


        <!-- ADS -->

        <button
            class="nav-button"
            data-section="ads"
            onclick="showSection('ads', this)"
        >

            <span class="nav-icon">
                📺
            </span>

            <span data-key="ads">
                Ads
            </span>

        </button>


        <!-- TASKS -->

        <button
            class="nav-button"
            data-section="tasks"
            onclick="showSection('tasks', this)"
        >

            <span class="nav-icon">
                🎯
            </span>

            <span data-key="tasks">
                Tasks
            </span>

        </button>


        <!-- REFERRAL -->

        <button
            class="nav-button"
            data-section="referral"
            onclick="showSection('referral', this)"
        >

            <span class="nav-icon">
                👥
            </span>

            <span data-key="referral">
                Referral
            </span>

        </button>


        <!-- WITHDRAW -->

        <button
            class="nav-button"
            data-section="withdraw"
            onclick="showSection('withdraw', this)"
        >

            <span class="nav-icon">
                💰
            </span>

            <span data-key="withdraw">
                Withdraw
            </span>

        </button>


        <!-- ACCOUNT -->

        <button
            class="nav-button"
            data-section="account"
            onclick="showSection('account', this)"
        >

            <span class="nav-icon">
                👤
            </span>

            <span data-key="account">
                Account
            </span>

        </button>


    </div>

</div>


<script>


    /* =========================
       TELEGRAM
    ========================= */

    const tg =
        window.Telegram.WebApp;

    tg.ready();

    tg.expand();


    /* =========================
       TELEGRAM USER
    ========================= */

    const user =
        tg.initDataUnsafe?.user || null;


    /* =========================
       BALANCE
    ========================= */

    let coins = 0;


    function updateBalance() {

        document
            .getElementById("coins")
            .textContent =
            Number(coins).toLocaleString();


        const usd =
            Number(coins) / 1000000;


        document
            .getElementById("usdValue")
            .textContent =
            "≈ $" + usd.toFixed(6);

    }


    /* =========================
       LOAD USER BALANCE
    ========================= */

    async function loadUserBalance() {

        if (!user) {

            console.log(
                "Telegram user not available."
            );

            return;

        }


        try {

            const response =
                await fetch(
                    "/api/user/" +
                    encodeURIComponent(user.id)
                );


            const data =
                await response.json();


            if (
                data.success &&
                data.user
            ) {

                coins =
                    Number(
                        data.user.coins || 0
                    );

                updateBalance();

                console.log(
                    "Balance loaded:",
                    coins
                );

            }

        } catch (error) {

            console.error(
                "Balance loading error:",
                error
            );

        }

    }


    /* =========================

            tasksTitle:
                "Tasks",

            tasksText:
                "Complete available tasks and earn rewards.",

            referralTitle:
                "Referral",

            referralText:
                "Invite friends and earn referral rewards.",

            withdrawTitle:
                "Withdraw",

            withdrawText:
                "Withdraw your available balance.",

            accountTitle:
                "Account",

            accountText:
                "View your account information and statistics.",

            claim:
                "🎁 Claim 1,000 Coins",

            claimed:
                "✅ Reward Claimed",

            congratulations:
                "🎉 Congratulations! You received 1,000 coins.",

            waiting:
                "⏳ Next reward in",

            error:
                "Something went wrong. Please try again."

        },


        fa: {

            balance:
                "موجودی شما",

            daily:
                "روزانه",

            ads:
                "تبلیغات",

            tasks:
                "تسک‌ها",

            referral:
                "رفرال",

            withdraw:
                "برداشت",

            account:
                "حساب",

            dailyTitle:
                "پاداش روزانه",

            dailyText:
                "هر ۱۲ ساعت پاداش خود را دریافت کنید.",

            adsTitle:
                "دیدن تبلیغات",

            adsText:
                "تبلیغات را تماشا کنید و سکه دریافت کنید.",

            tasksTitle:
                "تسک‌ها",

            tasksText:
                "تسک‌های موجود را انجام دهید و پاداش دریافت کنید.",

            referralTitle:
                "رفرال",

            referralText:
                "دوستان خود را دعوت کنید و پاداش رفرال دریافت کنید.",

            withdrawTitle:
                "برداشت",

            withdrawText:
                "موجودی قابل برداشت خود را برداشت کنید.",

            accountTitle:
                "حساب کاربری",

            accountText:
                "اطلاعات حساب و آمار خود را مشاهده کنید.",

            claim:
                "🎁 دریافت ۱,۰۰۰ سکه",

            claimed:
                "✅ پاداش دریافت شد",

            congratulations:
                "🎉 تبریک! شما ۱,۰۰۰ سکه دریافت کردید.",

            waiting:
                "⏳ پاداش بعدی تا",

            error:
                "خطایی رخ داد. لطفاً دوباره تلاش کنید."

        },


        ar: {

            balance:
                "رصيدك",

            daily:
                "اليومي",

            ads:
                "الإعلانات",

            tasks:
                "المهام",

            referral:
                "الإحالة",

            withdraw:
                "السحب",

            account:
                "الحساب",

            dailyTitle:
                "المكافأة اليومية",

            dailyText:
                "احصل على مكافأتك كل 12 ساعة.",

            adsTitle:
                "مشاهدة الإعلانات",

            adsText:
                "شاهد الإعلانات واربح العملات.",

            tasksTitle:
                "المهام",

            tasksText:
                "أكمل المهام المتاحة واحصل على المكافآت.",

            referralTitle:
                "الإحالة",

            referralText:
                "ادعُ أصدقاءك واربح مكافآت الإحالة.",

            withdrawTitle:

            withdrawText:
                "اسحب رصيدك المتاح.",

            accountTitle:
                "الحساب",

            accountText:
                "عرض معلومات حسابك وإحصائياتك.",

            claim:
                "🎁 احصل على 1,000 عملة",

            claimed:
                "✅ تم استلام المكافأة",

            congratulations:
                "🎉 مبروك! حصلت على 1,000 عملة.",

            waiting:
                "⏳ المكافأة التالية خلال",

            error:
                "حدث خطأ. حاول مرة أخرى."

        }

    };


    /* =========================
       SECTION ICONS
    ========================= */

    const sectionIcons = {

        daily: "🎁",

        ads: "📺",

        tasks: "🎯",

        referral: "👥",

        withdraw: "💰",

        account: "👤"

    };


    let currentSection =
        "daily";


    /* =========================
       SHOW SECTION
    ========================= */

    function showSection(
        section,
        button
    ) {

        currentSection =
            section;


        document
            .querySelectorAll(".nav-button")
            .forEach(function(btn) {

                btn.classList.remove(
                    "active"
                );

            });


        if (button) {

            button.classList.add(
                "active"
            );

        }


        const lang =
            localStorage.getItem("language") ||
            detectLanguage();


        const t =
            translations[lang];


        const content = {


            daily: {

                title:
                    t.dailyTitle,

                text:
                    t.dailyText

            },


            ads: {

                title:
                    t.adsTitle,

                text:
                    t.adsText

            },


            tasks: {

                title:
                    t.tasksTitle,

                text:
                    t.tasksText

            },


            referral: {

                title:
                    t.referralTitle,

                text:
                    t.referralText

            },


            withdraw: {

                title:
                    t.withdrawTitle,

                text:
                    t.withdrawText

            },


            account: {

                title:
                    t.accountTitle,

                text:
                    t.accountText

            }

        };


        document
            .getElementById("contentIcon")
            .textContent =
            sectionIcons[section];


        document
            .getElementById("contentTitle")
            .textContent =
            content[section].title;


        document
            .getElementById("contentText")
            .textContent =
            content[section].text;


        /*
         Show Daily Reward button
         only on Daily section.
        */

        const rewardButton =
            document.getElementById(
                "rewardButton"
            );


        const rewardStatus =
            document.getElementById(
                "rewardStatus"
            );


        if (section === "daily") {

            rewardButton.style.display =
                "block";

            rewardStatus.style.display =
                "block";

            checkDailyReward();

        } else {

            rewardButton.style.display =
                "none";

            rewardStatus.style.display =
                "none";

        }

    }


    /* =========================
       LANGUAGE DETECTION
    ========================= */

    function detectLanguage() {

        if (!user) {

            return "en";

        }


        const telegramLanguage =
            (
                user.language_code ||
                ""
            ).toLowerCase();


        if (
            telegramLanguage === "fa" ||
            telegramLanguage.startsWith("fa-")
        ) {

            return "fa";

        }


        if (
            telegramLanguage === "ar" ||
            telegramLanguage.startsWith("ar-")
        ) {

            return "ar";

        }


        return "en";

    }


    /* =========================
       APPLY LANGUAGE
    ========================= */

    function applyLanguage(lang) {

        if (
            !translations[lang]
        ) {

            lang = "en";

        }


        const t =
            translations[lang];


        document.documentElement.lang =
            lang;


        document.documentElement.dir =
            lang === "en"
                ? "ltr"
                : "rtl";


        document
            .getElementById("balanceTitle")
            .textContent =
            t.balance;


        document
            .querySelectorAll("[data-key]")
            .forEach(function(element) {

                const key =
                    element.getAttribute(
                        "data-key"
                    );


                if (t[key]) {

                    element.textContent =
                        t[key];

                }

            });


        document
            .getElementById(
                "languageButton"
            )
            .textContent = {

                en: "🌐 EN",

                fa: "🌐 FA",

                ar: "🌐 AR"

            }[lang];


        document
            .getElementById(
                "rewardButton"
            )
            .textContent =
            t.claim;


        const activeButton =
            document.querySelector(
                ".nav-button.active"
            );


        showSection(
            currentSection,
            activeButton
        );

    }


    /* =========================
       CHANGE LANGUAGE
    ========================= */

    function changeLanguage(lang) {

        localStorage.setItem(
            "language",
            lang
        );


        applyLanguage(
            lang
        );


        document
            .getElementById(
                "languageMenu"
            )
            .classList.remove(
                "show"
            );

    }


    /* =========================
       LANGUAGE MENU
    ========================= */

    function toggleLanguageMenu() {

        document
            .getElementById(
                "languageMenu"
            )
            .classList.toggle(
                "show"
            );

    }


    document.addEventListener(
        "click",
        function(event) {

            const menu =
                document.getElementById(
                    "languageMenu"
                );


            const button =
                document.getElementById(
                    "languageButton"
                );


            if (
                !menu.contains(
                    event.target
                ) &&
                !button.contains(
                    event.target
                )
            ) {

                menu.classList.remove(
                    "show"
                );

            }

        }
    );


    /* =========================
       CHECK DAILY REWARD
    ========================= */

    async function checkDailyReward() {

        if (!user) {
            return;
        }


        try {

            const response =
                await fetch(
                    "/api/user/" +
                    encodeURIComponent(
                        user.id
                    )
                );


            const data =
                await response.json();


            if (
                !data.success ||
                !data.user
            ) {
                return;
            }


            const lastReward =
                data.user.last_daily_reward;


            const button =
                document.getElementById(
                    "rewardButton"
                );


            const status =
                document.getElementById(
                    "rewardStatus"
                );


            const lang =
                localStorage.getItem(
                    "language"
                ) ||
                detectLanguage();


            const t =
                translations[lang];


            if (!lastReward) {

                button.disabled =
                    false;

                button.textContent =
                    t.claim;

                status.textContent =
                    "";

                return;

            }


            const lastTime =
                new Date(lastReward)
                    .getTime();


            const nextTime =
                lastTime +
                (12 * 60 * 60 * 1000);


            const now =
                Date.now();


            if (now >= nextTime) {

                button.disabled =
                    false;

                button.textContent =
                    t.claim;

                status.textContent =
                    "";

                return;

            }


            button.disabled =
                true;

            button.textContent =
                t.claimed;


            updateWaitingTime(
                nextTime
            );


        } catch (error) {

            console.error(
                "Daily reward check error:",
                error
            );

        }

    }


    /* =========================
       WAITING TIME
    ========================= */

    function updateWaitingTime(
        nextTime
    ) {

        const status =
            document.getElementById(
                "rewardStatus"
            );


        const lang =
            localStorage.getItem(
                "language"
            ) ||
            detectLanguage();


        const t =
            translations[lang];


        function update() {

            const remaining =
                nextTime - Date.now();


            if (remaining <= 0) {

                checkDailyReward();

                return;

            }


            const totalMinutes =
                Math.ceil(
                    remaining / 60000
                );


            const hours =
                Math.floor(
                    totalMinutes / 60
                );


            const minutes =
                totalMinutes % 60;


            status.className =
                "reward-status reward-waiting";


            status.textContent =
                t.waiting +
                " " +
                hours +
                "h " +
                minutes +
                "m";

        }


        update();


        setTimeout(
            function() {

                checkDailyReward();

            },
            60000
        );

    }


    /* =========================
       CLAIM DAILY REWARD
    ========================= */

    async function claimDailyReward() {

        if (!user) {

            return;

        }


        const button =
            document.getElementById(
                "rewardButton"
            );


        const status =
            document.getElementById(
                "rewardStatus"
            );


        const lang =
            localStorage.getItem(
                "language"
            ) ||
            detectLanguage();


        const t =
            translations[lang];


        button.disabled =
            true;


        try {

            const response =
                await fetch(
                    "/api/daily-reward",
                    {

                        method: "POST",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body:
                            JSON.stringify({

                                telegram_id:
                                    user.id

                            })

                    }
                );


            const data =
                await response.json();


            if (data.success) {

                /*
                 Update balance immediately
                */

                coins =
                    Number(
                        data.user.coins
                    );


                updateBalance();


                button.textContent =
                    t.claimed;


                status.className =
                    "reward-status reward-success";


                status.textContent =
                    t.congratulations;


                /*
                 Check again after
                 successful reward.
                */

                setTimeout(
                    function() {

                        checkDailyReward();

                    },
                    1500
                );


            } else {

                button.disabled =
                    true;


                button.textContent =
                    t.claimed;


                status.className =
                    "reward-status reward-waiting";


                if (
                    data.next_reward
                ) {

                    updateWaitingTime(
                        new Date(
                            data.next_reward
                        ).getTime()
                    );

                } else {

                    status.textContent =
                        data.message ||
                        t.error;

                }

            }


        } catch (error) {

            console.error(
                "Daily reward error:",
                error
            );


            button.disabled =
                false;


            status.className =
                "reward-status reward-error";


            status.textContent =
                t.error;

        }

    }


    /* =========================
       REGISTER USER
    ========================= */

    async function registerUser() {

        if (!user) {

            console.log(
                "Telegram user not available."
            );

            return;

        }


        const language =
            localStorage.getItem(
                "language"
            ) ||
            detectLanguage();


        try {

            const response =
                await fetch(
                    "/api/user",
                    {

                        method: "POST",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body:
                            JSON.stringify({

                                telegram_id:
                                    user.id,

                                first_name:
                                    user.first_name ||
                                    "",

                                username:
                                    user.username ||
                                    "",

                                language:
                                    language

                            })

                    }
                );


            const data =
                await response.json();


            if (data.success) {

                console.log(
                    "EarnPool user registered:",
                    data.user
                );

            }

        } catch (error) {

            console.error(
                "User registration error:",
                error
            );

        }

    }


    /* =========================
       START USER
    ========================= */

    async function startUser() {

        await registerUser();

        await loadUserBalance();

        await checkDailyReward();

    }


    /* =========================
       INITIAL LANGUAGE
    ========================= */

    let savedLanguage =
        localStorage.getItem(
            "language"
        );


    if (
        !savedLanguage ||
        !translations[savedLanguage]
    ) {

        savedLanguage =
            detectLanguage();

    }


    applyLanguage(
        savedLanguage
    );


    updateBalance();


    startUser();


    /* =========================
       TELEGRAM USER LOG
    ========================= */

    if (user) {

        console.log(
            "EarnPool User:",
            user.id,
            user.first_name
        );

    }

</script>
