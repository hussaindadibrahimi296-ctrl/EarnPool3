            text-align: center;
            border-radius: 8px;
            cursor: pointer;

            font-size: 14px;
            margin-bottom: 8px;
        }

        .coins {
            font-size: 30px;
            font-weight: bold;
        }

        .usd-value {
            margin-top: 6px;
            color: #8f98a8;
            font-size: 15px;
        }

        .content-card {

            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .reward-button:disabled,

            background: #303744;
            color: #8f98a8;

        }

<div class="app">

    <div class="top-bar">

        <div class="logo">
            EarnPool

    <div

            ≈ $0.000000

    </div>

    <!-- CONTENT -->

            Daily Reward
        </div>

        >
            Claim your daily reward and earn coins every 12 hours.
        </div>

        <!-- DAILY -->

        <button

            🎁 Claim 1,000 Coins

        <div

        <!-- ADS -->

                    </span>

                        </span>

                        /

                        <span id="adsLimit">

                        </span>

                    </strong>

                </div>

                <div class="ads-row">

                    <span id="adsRemainingLabel">
                        Ads remaining
                    </span>

                    <strong id="adsRemaining">
                        10
                    </strong>

                </div>

                <div class="ads-row">

                    <span id="adsRewardLabel">
                        Reward
                    </span>

                    <strong>
                        2,000 🪙
                    </strong>

                </div>

            </div>

            <button
                id="watchAdButton"
                class="watch-ad-button"
                onclick="watchAd()"

                📺 Watch Ad +2,000
            </button>

            <div
                id="adsMessage"
                class="ads-message"
            ></div>

        </div>

        <!-- TASKS -->

        <div
            id="tasksPanel"
            class="tasks-panel"
            style="display:none;"
        >

            <div id="tasksList"></div>

            <div
                id="taskMessage"
                class="task-message"
            ></div>

        </div>

        <!-- REFERRAL -->

        <div
            id="referralPanel"
            class="referral-panel"
            style="display:none;"
        >

            <div class="referral-info">

                <div class="referral-row">

                    <span
                        class="referral-label"
                        id="referralsCountLabel"
                    >
                        Friends invited
                    </span>

                    <strong
                        class="referral-value"
                        id="referralsCount"
                    >
                        0
                    </strong>

                </div>

                <div class="referral-row">

                    <span
                        class="referral-label"
                        id="referralRewardLabel"
                    >
                        Reward per referral
                    </span>

                    <strong
                        class="referral-value"
                        id="referralReward"
                    >
                        5,000 🪙
                    </strong>

                </div>

                <div class="referral-row">

                    <span
                        class="referral-label"
                        id="referralEarningsLabel"
                    >
                        Referral earnings
                    </span>

                    <strong
                        class="referral-value"
                        id="referralEarnings"
                    >
                        0 🪙
                    </strong>

                </div>

            </div>

            <div class="referral-link-box">

                <input
                    type="text"
                    id="referralLink"
                    class="referral-link"
                    readonly
                    value=""
                >

                <div class="referral-buttons">

                    <button
                        id="copyReferralButton"
                        class="referral-button copy-referral-button"
                        onclick="copyReferralLink()"
                    >
                        📋 Copy Link
                    </button>

                    <button
                        id="shareReferralButton"
                        class="referral-button share-referral-button"
                        onclick="shareReferralLink()"
                    >
                        📤 Share
                    </button>

                </div>

            </div>

            <div
                id="referralMessage"
                class="referral-message"
            ></div>

        </div>

    </div>

</div>

<!-- BOTTOM NAV -->

<div class="bottom-nav">

    <div class="nav-container">

        <button
            class="nav-button active"
            data-section="daily"
            onclick="showSection('daily', this)"
        >
            <span class="nav-icon">🎁</span>
            <span data-key="daily">Daily</span>
        </button>

        <button
            class="nav-button"
            data-section="ads"
            onclick="showSection('ads', this)"
        >
            <span class="nav-icon">📺</span>
            <span data-key="ads">Ads</span>
        </button>

        <button
            class="nav-button"
            data-section="tasks"
            onclick="showSection('tasks', this)"
        >
            <span class="nav-icon">🎯</span>
            <span data-key="tasks">Tasks</span>
        </button>

        <button
            class="nav-button"
            data-section="referral"
            onclick="showSection('referral', this)"
        >
            <span class="nav-icon">👥</span>
            <span data-key="referral">Referral</span>
        </button>

        <button
            class="nav-button"
            data-section="withdraw"
            onclick="showSection('withdraw', this)"
        >
            <span class="nav-icon">💰</span>
            <span data-key="withdraw">Withdraw</span>
        </button>

        <button
            class="nav-button"
            data-section="account"
            onclick="showSection('account', this)"
        >
            <span class="nav-icon">👤</span>
            <span data-key="account">Account</span>
        </button>

    </div>

</div>

/* =====================================================
   DETECT LANGUAGE
===================================================== */

function detectLanguage() {

    if (!user) {
        return "en";
    }

    const code =
        (
            user.language_code ||
            ""
        ).toLowerCase();

    if (
        code === "fa" ||
        code.startsWith("fa-")
    ) {

        return "fa";

    }

    if (
        code === "ar" ||
        code.startsWith("ar-")
    ) {

        return "ar";

    }

    return "en";

}


/* =====================================================
   GET LANGUAGE
===================================================== */

function getLanguage() {

    return (
        localStorage.getItem("language") ||
        detectLanguage()
    );

}


/* =====================================================
   APPLY LANGUAGE
===================================================== */

function applyLanguage(lang) {

    if (!translations[lang]) {
        lang = "en";
    }

    const t =
        translations[lang];

    document.documentElement.lang =
        lang;

    document.documentElement.dir =
        lang === "en"
            ? "ltr"
            : "rtl";

    document.getElementById(
        "balanceTitle"
    ).textContent =
        t.balance;

    document
        .querySelectorAll("[data-key]")
        .forEach(function(element) {

            const key =
                element.getAttribute(
                    "data-key"
                );

            if (t[key]) {
                element.textContent =
                    t[key];
            }

        });

    document.getElementById(
        "languageButton"
    ).textContent = {

        en: "🌐 EN",
        fa: "🌐 FA",
        ar: "🌐 AR"

    }[lang];

    document.getElementById(
        "rewardButton"
    ).textContent =
        t.claim;

    document.getElementById(
        "adsWatchedLabel"
    ).textContent =
        t.adsWatched;

    document.getElementById(
        "adsRemainingLabel"
    ).textContent =
        t.adsRemaining;

    document.getElementById(
        "adsRewardLabel"
    ).textContent =
        t.adsReward;

    document.getElementById(
        "watchAdButton"
    ).textContent =
        t.watchAd;

    document.getElementById(
        "referralsCountLabel"
    ).textContent =
        t.friendsInvited;

    document.getElementById(
        "referralRewardLabel"
    ).textContent =
        t.rewardPerReferral;

    document.getElementById(
        "referralEarningsLabel"
    ).textContent =
        t.referralEarnings;

    document.getElementById(
        "copyReferralButton"
    ).textContent =
        t.copyLink;

    document.getElementById(
        "shareReferralButton"
    ).textContent =
        t.share;

    showSection(
        currentSection,
        document.querySelector(
            ".nav-button.active"
        )
    );

}

/* =====================================================
   DAILY REWARD CHECK
===================================================== */

async function checkDailyReward() {

    if (!user) {
        return;
    }

    try {

        const response =
            await fetch(
                "/api/user/" +
                encodeURIComponent(
                    user.id
                )
            );

        const data =
            await response.json();

        if (
            !data.success ||
            !data.user
        ) {

            return;

        }

        const lastReward =
            data.user.last_daily_reward;

        const button =
            document.getElementById(
                "rewardButton"
            );

        const status =
            document.getElementById(
                "rewardStatus"
            );

        const t =
            translations[
                getLanguage()
            ];


        if (!lastReward) {

            button.disabled =
                false;

            button.textContent =
                t.claim;

            status.textContent =
                "";

            return;

        }


        const lastTime =
            new Date(
                lastReward
            ).getTime();

        const nextTime =
            lastTime +
            (
                12 *
                60 *
                60 *
                1000
            );

        const now =
            Date.now();


        if (now >= nextTime) {

            button.disabled =
                false;

            button.textContent =
                t.claim;

            status.textContent =
                "";

            return;

        }


        button.disabled =
            true;

        button.textContent =
            t.claimed;

        updateWaitingTime(
            nextTime
        );

    } catch (error) {

        console.error(
            "Daily reward check error:",
            error
        );

    }

}


/* =====================================================
   DAILY WAITING TIME
===================================================== */

function updateWaitingTime(nextTime) {

    const status =
        document.getElementById(
            "rewardStatus"
        );

    const t =
        translations[
            getLanguage()
        ];

    function update() {

        const remaining =
            nextTime -
            Date.now();

        if (remaining <= 0) {

            checkDailyReward();

            return;

        }

        const totalMinutes =
            Math.ceil(
                remaining / 60000
            );

        const hours =
            Math.floor(
                totalMinutes / 60
            );

        const minutes =
            totalMinutes % 60;

        status.className =
            "reward-status reward-waiting";

        status.textContent =
            t.waiting +
            " " +
            hours +
            "h " +
            minutes +
            "m";

    }

    update();

    setTimeout(
        function() {

            checkDailyReward();

        },
        60000
    );

}


/* =====================================================
   CLAIM DAILY REWARD
===================================================== */

async function claimDailyReward() {

    if (!user) {
        return;
    }

    const button =
        document.getElementById(
            "rewardButton"
        );

    const status =
        document.getElementById(
            "rewardStatus"
        );

    const t =
        translations[
            getLanguage()
        ];

    button.disabled =
        true;

    try {

        const response =
            await fetch(
                "/api/daily-reward",
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            telegram_id:
                                user.id

                        })

                }
            );

        const data =
            await response.json();


        if (data.success) {

            coins =
                Number(
                    data.user.coins
                );

            updateBalance();

            button.textContent =
                t.claimed;

            status.className =
                "reward-status reward-success";

            status.textContent =
                t.congratulations;

            setTimeout(
                function() {

                    checkDailyReward();

                },
                1500
            );

        } else {

            button.disabled =
                true;

            button.textContent =
                t.claimed;

            status.className =
                "reward-status reward-waiting";

            if (data.next_reward) {

                updateWaitingTime(
                    new Date(
                        data.next_reward
                    ).getTime()
                );

            } else {

                status.textContent =
                    data.message ||
                    t.error;

            }

        }

    } catch (error) {

        console.error(
            "Daily reward error:",
            error
        );

        button.disabled =
            false;

        status.className =
            "reward-status reward-error";

        status.textContent =
            t.error;

    }

}

        ];

            await AdController.show();

        ) {

                );

                "adsWatched"

            ).textContent =

            ) {

                t.adError;

        );

        message.className =
            "ads-message ads-error";

        message.textContent =
            t.adError;

        await loadAdsStatus();
