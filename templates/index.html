<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>EarnPool</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0f1117;
            color: #ffffff;
            min-height: 100vh;
        }

        button {
            font-family: inherit;
        }

        .app {
            width: 100%;
            max-width: 520px;
            margin: auto;
            min-height: 100vh;
            padding-bottom: 90px;
        }

        /* =========================
           HEADER
        ========================= */

        .header {
            padding: 18px 16px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
        }

        .language-wrapper {
            position: relative;
        }

        .language-button {
            border: none;
            background: #1d222d;
            color: white;
            padding: 9px 12px;
            border-radius: 12px;
            cursor: pointer;
        }

        .language-menu {
            display: none;
            position: absolute;
            right: 0;
            top: 45px;
            background: #1c212b;
            border-radius: 12px;
            padding: 6px;
            z-index: 1000;
            min-width: 120px;
            box-shadow: 0 10px 30px rgba(0,0,0,.4);
        }

        .language-menu.show {
            display: block;
        }

        .language-menu button {
            width: 100%;
            background: transparent;
            color: white;
            border: none;
            padding: 10px;
            text-align: left;
            border-radius: 8px;
            cursor: pointer;
        }

        .language-menu button:hover {
            background: #292f3b;
        }

        /* =========================
           BALANCE
        ========================= */

        .balance-card {
            margin: 10px 16px 16px;
            padding: 25px 20px;
            border-radius: 20px;
            background: linear-gradient(
                135deg,
                #1d2430,
                #151923
            );
            text-align: center;
            border: 1px solid #2d3442;
        }

        .balance-title {
            font-size: 14px;
            opacity: .7;
            margin-bottom: 8px;
        }

        .balance-value {
            font-size: 36px;
            font-weight: bold;
        }

        .coin-label {
            opacity: .65;
            margin-top: 5px;
            font-size: 13px;
        }

        /* =========================
           CONTENT
        ========================= */

        .content {
            margin: 0 16px;
        }

        .content-card {
            background: #171b24;
            border-radius: 18px;
            padding: 20px;
            border: 1px solid #252b37;
        }

        .content-icon {
            font-size: 38px;
            margin-bottom: 10px;
        }

        .content-title {
            font-size: 22px;
            margin-bottom: 8px;
        }

        .content-text {
            font-size: 14px;
            color: #aeb5c2;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        /* =========================
           BUTTONS
        ========================= */

        .primary-button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 13px;
            background: #f5c542;
            color: #111;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .primary-button:disabled {
            opacity: .5;
            cursor: not-allowed;
        }

        /* =========================
           REWARD STATUS
        ========================= */

        .reward-status,
        .ads-message,
        .task-message {
            margin-top: 12px;
            font-size: 13px;
            text-align: center;
            line-height: 1.5;
        }

        .reward-success,
        .ads-success,
        .task-success {
            color: #4ade80;
        }

        .reward-error,
        .ads-error,
        .task-error {
            color: #fb7185;
        }

        .reward-waiting,
        .ads-waiting {
            color: #facc15;
        }

        /* =========================
           ADS
        ========================= */

        .ads-panel,
        .tasks-panel {
            display: none;
        }

        .ads-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 18px;
        }

        .ads-stat {
            background: #202631;
            border-radius: 12px;
            padding: 13px 5px;
            text-align: center;
        }

        .ads-stat-value {
            font-size: 19px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .ads-stat-label {
            font-size: 11px;
            opacity: .6;
        }

        /* =========================
           TASKS
        ========================= */

        .task-card {
            background: #202631;
            border-radius: 14px;
            padding: 15px;
            margin-bottom: 12px;
        }

        .task-title {
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 7px;
        }

        .task-description {
            color: #aeb5c2;
            font-size: 13px;
            line-height: 1.5;
            margin-bottom: 10px;
        }

        .task-reward {
            color: #f5c542;
            font-weight: bold;
            margin-bottom: 12px;
            font-size: 13px;
        }

        .task-button {
            width: 100%;
            border: none;
            background: #303846;
            color: white;
            padding: 11px;
            border-radius: 10px;
            cursor: pointer;
        }

        .task-button:disabled {
            opacity: .5;
        }

        /* =========================
           REFERRAL
        ========================= */

        .referral-panel {
            display: none;
        }

        .referral-box {
            background: #202631;
            border-radius: 14px;
            padding: 16px;
            margin-top: 15px;
        }

        .referral-title {
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .referral-link {
            width: 100%;
            background: #11151c;
            border: 1px solid #303744;
            color: #cbd5e1;
            border-radius: 10px;
            padding: 11px;
            font-size: 12px;
            outline: none;
            margin-top: 8px;
        }

        .referral-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 10px;
        }

        .referral-button {
            border: none;
            border-radius: 10px;
            padding: 11px;
            background: #303846;
            color: white;
            cursor: pointer;
        }

        .referral-button.share {
            background: #f5c542;
            color: #111;
        }

        .referral-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
        }

        .referral-stat {
            background: #171b24;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
        }

        .referral-stat-value {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .referral-stat-label {
            font-size: 11px;
            opacity: .6;
        }

        .referral-message {
            margin-top: 10px;
            text-align: center;
            font-size: 13px;
        }

        /* =========================
           ACCOUNT
        ========================= */

        .account-panel {
            display: none;
        }

        .account-row {
            display: flex;
            justify-content: space-between;
            padding: 13px 0;
            border-bottom: 1px solid #292f3a;
            font-size: 14px;
        }

        .account-row:last-child {
            border-bottom: none;
        }

        .account-label {
            opacity: .6;
        }

        /* =========================
           NAVIGATION
        ========================= */

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 520px;
            background: #151922;
            border-top: 1px solid #292f39;
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            padding: 8px 4px;
            z-index: 999;
        }

            border: none;
            background:
