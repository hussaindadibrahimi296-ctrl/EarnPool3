/* ============================================================
   LANGUAGE DETECTION
============================================================ */

function detectLanguage() {

    if (!user) {
        return "en";
    }

    const code =
        (
            user.language_code ||
            ""
        ).toLowerCase();


    if (
        code === "fa" ||
        code.startsWith("fa-")
    ) {

        return "fa";

    }


    if (
        code === "ar" ||
        code.startsWith("ar-")
    ) {

        return "ar";

    }


    return "en";

}


/* ============================================================
   CURRENT LANGUAGE
============================================================ */

function getLanguage() {

    const saved =
        localStorage.getItem(
            "language"
        );


    if (
        saved &&
        translations[saved]
    ) {

        return saved;

    }


    return detectLanguage();

}


/* ============================================================

============================================================ */

    const lang =
        getLanguage();

    return (
        translations[lang][key] ||
        translations.en[key] ||
        key
    );

}


/* ============================================================
   APPLY LANGUAGE
============================================================ */

function applyLanguage(lang) {

    if (
        !translations[lang]
    ) {

        lang = "en";

    }


    localStorage.setItem(
        "language",
        lang
    );


    document.documentElement.lang =
        lang;


    document.documentElement.dir =
        lang === "en"
            ? "ltr"
            : "rtl";


    document
        .querySelectorAll("[data-key]")
        .forEach(
            function(element) {

                const key =
                    element.getAttribute(
                        "data-key"
                    );

                if (
                    translations[lang][key]
                ) {

                    element.textContent =
                        translations[lang][key];

                }

            }
        );


    document
        .getElementById(
            "balanceTitle"
        )
        .textContent =
        translations[lang].balance;


    document
        .getElementById(
            "languageButton"
        )
        .textContent = {

            en: "🌐 EN",

            fa: "🌐 FA",

            ar: "🌐 AR"

        }[lang];


    document
        .getElementById(
            "rewardButton"
        )
        .textContent =
        translations[lang].claim;


    document
        .getElementById(
            "adsWatchedLabel"
        )
        .textContent =
        translations[lang].adsWatched;


    document
        .getElementById(
            "adsRemainingLabel"
        )
        .textContent =
        translations[lang].adsRemaining;


    document
        .getElementById(
            "adsRewardLabel"
        )
        .textContent =
        translations[lang].adsReward;


    document
        .getElementById(
            "watchAdButton"
        )
        .textContent =
        translations[lang].watchAd;


    showSection(
        currentSection,
        document.querySelector(
            `.nav-button[data-section="${currentSection}"]`
        )
    );

}

/* ============================================================
   DAILY REWARD CHECK
============================================================ */

async function checkDailyReward() {

    if (!user) {
        return;
    }


    try {

        const response =
            await fetch(
                "/api/user/" +
                encodeURIComponent(
                    user.id
                )
            );


        const data =
            await response.json();


        if (
            !data.success ||
            !data.user
        ) {

            return;

        }


        const lastReward =
            data.user.last_daily_reward;


        const button =
            document.getElementById(
                "rewardButton"
            );

        const status =
            document.getElementById(
                "rewardStatus"
            );


        if (!lastReward) {

            button.disabled =
                false;

            button.textContent =
                t("claim");

            status.textContent =
                "";

            return;

        }


        const lastTime =
            new Date(
                lastReward
            ).getTime();


        const nextTime =
            lastTime +
            (
                12 *
                60 *
                60 *
                1000
            );


        if (
            Date.now() >=
            nextTime
        ) {

            button.disabled =
                false;

            button.textContent =
                t("claim");

            status.textContent =
                "";

            return;

        }


        button.disabled =
            true;

        button.textContent =
            t("claimed");


        updateWaitingTime(
            nextTime
        );

    } catch (error) {

        console.error(
            "Daily check:",
            error
        );

    }

}


/* ============================================================
   WAITING TIME
============================================================ */

function updateWaitingTime(
    nextTime
) {

    const status =
        document.getElementById(
            "rewardStatus"
        );


    function update() {

        const remaining =
            nextTime -
            Date.now();


        if (
            remaining <= 0
        ) {

            checkDailyReward();

            return;

        }


        const totalMinutes =
            Math.ceil(
                remaining / 60000
            );


        const hours =
            Math.floor(
                totalMinutes / 60
            );


        const minutes =
            totalMinutes % 60;


        status.className =
            "reward-status reward-waiting";


        status.textContent =
            t("waiting") +
            " " +
            hours +
            "h " +
            minutes +
            "m";

    }


    update();


    setTimeout(
        function() {

            checkDailyReward();

        },
        60000
    );

}


/* ============================================================
   CLAIM DAILY REWARD
============================================================ */

async function claimDailyReward() {

    if (!user) {
        return;
    }


    const button =
        document.getElementById(
            "rewardButton"
        );

    const status =
        document.getElementById(
            "rewardStatus"
        );


    button.disabled =
        true;


    try {

        const response =
            await fetch(
                "/api/daily-reward",
                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            telegram_id:
                                user.id

                        })

                }
            );


        const data =
            await response.json();


        if (
            data.success
        ) {

            coins =
                Number(
                    data.user.coins
                );


            updateBalance();


            status.className =
                "reward-status reward-success";


            status.textContent =
                t("congratulations");


            button.textContent =
                t("claimed");


            setTimeout(
                checkDailyReward,
                1500
            );

        }

        else {

            button.disabled =
                true;

            button.textContent =
                t("claimed");


            status.className =
                "reward-status reward-waiting";


            if (
                data.next_reward
            ) {

                updateWaitingTime(
                    new Date(
                        data.next_reward
                    ).getTime()
                );

            }

            else {

                status.textContent =
                    data.message ||
                    t("error");

            }

        }

    } catch (error) {

        console.error(
            "Daily reward:",
            error
        );


        button.disabled =
            false;


        status.className =
            "reward-status reward-error";


        status.textContent =
            t("error");

    }

}

============================================================ */

async function watchAd() {

    if (!user) {
        return;
    }


    const button =
        document.getElementById(
            "watchAdButton"
        );

    const message =
        document.getElementById(
            "adsMessage"
        );


    if (!AdController) {

        message.className =
            "ads-message ads-error";

        message.textContent =
            t("adError");

        console.error(
            "AdsGram controller is not available."
        );

        return;

    }


    button.disabled =
        true;


    message.className =
        "ads-message ads-waiting";


    message.textContent =
        "⏳ Loading advertisement...";


    try {

        const result =
            await AdController.show();


        /*
            AdsGram rewarded ad:
            done === true
            means the ad was completed.
        */

        if (
            !result ||
            result.done !== true
        ) {

            message.className =
                "ads-message ads-error";

            message.textContent =
                t("adError");

            await loadAdsStatus();

            return;

        }


        message.textContent =
            "⏳ Processing reward...";


        /*
            IMPORTANT:
            Reward is given by backend.
        */

        const response =
            await fetch(
                "/api/ads/claim",
                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            telegram_id:
                                user.id

                        })

                }
            );


        const data =
            await response.json();


        if (
            data.success
        ) {

            coins =
                Number(
                    data.user.coins
                );


            updateBalance();


            document
                .getElementById(
                    "adsWatched"
                )
                .textContent =
                data.ads_watched;


            document
                .getElementById(
                    "adsRemaining"
                )
                .textContent =
                data.ads_remaining;


            message.className =
                "ads-message ads-success";


            message.textContent =
                t("adSuccess");


            button.disabled =
                data.ads_remaining <= 0;

        }

        else {

            message.className =
                "ads-message ads-error";

            message.textContent =
                data.message ||
                t("adError");


            await loadAdsStatus();

        }

    } catch (error) {

        console.error(
            "AdsGram error:",
            error
        );


        message.className =
            "ads-message ads-error";

        message.textContent =
            t("adError");


        await loadAdsStatus();

    }

}


/* ============================================================
   LOAD TASKS
============================================================ */

async function loadTasks() {

    const list =
        document.getElementById(
            "taskList"
        );


    if (!user) {

        list.innerHTML =
            `<div class="task-error">
                ${t("taskError")}
            </div>`;

        return;

    }


    list.innerHTML =
        `<div class="task-loading">
            ${t("taskLoading")}
        </div>`;


    try {

        const response =
            await fetch(
                "/api/tasks/" +
                encodeURIComponent(
                    user.id
                ),
                {
                    method: "GET",
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        const data =
            await response.json();


        if (
            !data.success
        ) {

            throw new Error(
                data.message ||
                "Task API error"
            );

        }


        const tasks =
            Array.isArray(
                data.tasks
            )
                ? data.tasks
                : [];


        if (
            tasks.length === 0
        ) {

            list.innerHTML =
                `<div class="task-empty">
                    ${t("taskEmpty")}
                </div>`;

            return;

        }


        list.innerHTML = "";


        tasks.forEach(
            function(task) {

                renderTask(
                    task,
                    list
                );

            }
        );

    } catch (error) {

        console.error(
            "Load tasks error:",
            error
        );


        list.innerHTML =
            `<div class="task-error">
                ${t("taskError")}
                <br><br>
                <button
                    class="task-button"
                    onclick="loadTasks()"
                >
                    🔄 Retry
                </button>
            </div>`;

    }

}
