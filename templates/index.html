<!DOCTYPE html>

    <title>EarnPool</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            font-family: Arial, sans-serif;
            background: #10131a;
            color: white;
        }

        body {
            padding-bottom: 88px;
        }

        button {
            font-family: inherit;
        }

        .app {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            padding: 15px;
        }


        /* =========================
           TOP BAR
        ========================= */

        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
        }

        .logo {
            font-size: 23px;
            font-weight: bold;
        }

        .language-button {
            border: none;
            background: #1c2330;
            color: white;
            border-radius: 10px;
            padding: 8px 11px;
            font-size: 13px;
            cursor: pointer;
        }


        /* =========================
           LANGUAGE MENU
        ========================= */

        .language-menu {
            display: none;
            position: absolute;
            top: 58px;
            right: 15px;
            background: #1c2330;
            border-radius: 12px;
            padding: 6px;
            z-index: 100;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.35);
        }

        .language-menu.show {
            display: block;
        }

        .language-option {
            display: block;
            width: 125px;
            border: none;
            background: transparent;
            color: white;
            padding: 10px;
            text-align: center;
            border-radius: 8px;
            cursor: pointer;
        }

        .language-option:active {

        /* =========================
           BALANCE
        ========================= */

        .balance-card {

        }

            color: #9da5b4;
            font-size: 14px;

            font-weight: bold;
        }

           MAIN CONTENT
        ========================= */

            color: #aeb5c1;

        }


        /* =========================
           DAILY REWARD
        ========================= */

        .reward-button {
            width: 100%;

            background: #2d7dff;
            color: white;
            border-radius: 14px;
            padding: 14px;
            margin-top: 22px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .reward-button:active {
            transform: scale(0.98);
        }

        .reward-button:disabled {
            background: #303744;
            color: #8f98a8;
            cursor: not-allowed;
            transform: none;
        }

        .reward-status {
            text-align: center;
            margin-top: 14px;
            font-size: 14px;
            line-height: 1.6;
        }

        .reward-success {
            color: #58d68d;
        }

        .reward-waiting {
            color: #aeb5c1;
        }

        .reward-error {
            color: #ff7777;
        }


        /* =========================
           ADS
        ========================= */

        .ads-panel {
            margin-top: 20px;
        }

        .ads-info {
            background: #111722;
            border-radius: 14px;
            padding: 14px;
            margin-top: 15px;
        }

        .ads-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 7px 0;
            color: #b5bdc9;
            font-size: 14px;
        }

        .ads-row strong {
            color: white;
        }

            width: 100%;
            border: none;
            background: #2d7dff;
            color: white;

        }

        .ads-error {

        }

           BOTTOM NAVIGATION
        ========================= */

        .bottom-nav {

            right: 0;

            background: #151922;
            border-top: 1px solid #252b36;
            padding: 7px 4px;
            z-index: 50;
        }

        .nav-container {
            width: 100%;

            gap: 3px;

</head>

</div>


<!-- BOTTOM NAVIGATION -->

<script>


    /* =====================================================
       TELEGRAM
    ===================================================== */

    const tg =
        window.Telegram.WebApp;

    tg.ready();

    tg.expand();


    /* =====================================================
       TELEGRAM USER
    ===================================================== */

    const user =
        tg.initDataUnsafe?.user || null;


    /* =====================================================
       ADSGRAM
    ===================================================== */

    let AdController = null;


    try {

        if (
            window.Adsgram &&
            typeof window.Adsgram.init === "function"
        ) {

            AdController =
                window.Adsgram.init({
                    blockId: "44182"
                });

        }

    } catch (error) {

        console.error(
            "AdsGram initialization error:",
            error
        );

    }


    /* =====================================================
       BALANCE
    ===================================================== */

    let coins = 0;


    function updateBalance() {

        document
            .getElementById("coins")
            .textContent =
            Number(coins).toLocaleString();


        const usd =
            Number(coins) / 1000000;


        document
            .getElementById("usdValue")
            .textContent =
            "≈ $" + usd.toFixed(6);

    }


    /* =====================================================
       LOAD USER BALANCE
    ===================================================== */

    async function loadUserBalance() {

        if (!user) {
            return;
        }


        try {

            const response =
                await fetch(
                    "/api/user/" +
                    encodeURIComponent(user.id)
                );


            const data =
                await response.json();


            if (
                data.success &&
                data.user
            ) {

                coins =
                    Number(
                        data.user.coins || 0
                    );

                updateBalance();

            }

        } catch (error) {

            console.error(
                "Balance loading error:",
                error
            );

        }

    }

    /* =====================================================

        ads: "📺",

        tasks: "🎯",

        referral: "👥",

        withdraw: "💰",

        account: "👤"

    };


    let currentSection =
        "daily";


    /* =====================================================
       SHOW SECTION
    ===================================================== */

    function showSection(
        section,
        button
    ) {

        currentSection =
            section;


        document
            .querySelectorAll(".nav-button")
            .forEach(function(btn) {

                btn.classList.remove(
                    "active"
                );

            });


        if (button) {

            button.classList.add(
                "active"
            );

        }


        const lang =
            localStorage.getItem("language") ||
            detectLanguage();


        const t =
            translations[lang];


        const content = {

            daily: {

                title:
                    t.dailyTitle,

                text:
                    t.dailyText

            },

            ads: {

                title:
                    t.adsTitle,

                text:
                    t.adsText

            },

            tasks: {

                title:
                    t.tasksTitle,

                text:
                    t.tasksText

            },

            referral: {

                title:
                    t.referralTitle,

                text:
                    t.referralText

            },

            withdraw: {

                title:
                    t.withdrawTitle,

                text:
                    t.withdrawText

            },

            account: {

                title:
                    t.accountTitle,

                text:
                    t.accountText

            }

        };


        document
            .getElementById("contentIcon")
            .textContent =
            sectionIcons[section];


        document
            .getElementById("contentTitle")
            .textContent =
            content[section].title;


        document
            .getElementById("contentText")
            .textContent =
            content[section].text;


        const rewardButton =
            document.getElementById(
                "rewardButton"
            );

        const rewardStatus =
            document.getElementById(
                "rewardStatus"
            );

        const adsPanel =
            document.getElementById(
                "adsPanel"
            );


        /*
         DAILY
        */

        if (section === "daily") {

            rewardButton.style.display =
                "block";

            rewardStatus.style.display =
                "block";

            adsPanel.style.display =
                "none";

            checkDailyReward();

        }


        /*
         ADS
        */

        else if (section === "ads") {

            rewardButton.style.display =
                "none";

            rewardStatus.style.display =
                "none";

            adsPanel.style.display =
                "block";

            loadAdsStatus();

        }


        /*
         OTHER SECTIONS
        */

        else {

            rewardButton.style.display =
                "none";

            rewardStatus.style.display =
                "none";

            adsPanel.style.display =
                "none";

        }

    /* =====================================================
       LANGUAGE DETECTION
    ===================================================== */

    function detectLanguage() {

        if (!user) {
            return "en";
        }


        const telegramLanguage =
            (
                user.language_code ||
                ""
            ).toLowerCase();


        if (
            telegramLanguage === "fa" ||
            telegramLanguage.startsWith("fa-")
        ) {

            return "fa";

        }


        if (
            telegramLanguage === "ar" ||
            telegramLanguage.startsWith("ar-")
        ) {

            return "ar";

        }


        return "en";

    }


    /* =====================================================
       APPLY LANGUAGE
    ===================================================== */

    function applyLanguage(lang) {

        if (
            !translations[lang]
        ) {

            lang = "en";

        }


        const t =
            translations[lang];


        document.documentElement.lang =
            lang;


        document.documentElement.dir =
            lang === "en"
                ? "ltr"
                : "rtl";


        document
            .getElementById("balanceTitle")
            .textContent =
            t.balance;


        document
            .querySelectorAll("[data-key]")
            .forEach(function(element) {

                const key =
                    element.getAttribute(
                        "data-key"
                    );


                if (t[key]) {

                    element.textContent =
                        t[key];

                }

            });


        document
            .getElementById(
                "languageButton"
            )
            .textContent = {

                en: "🌐 EN",

                fa: "🌐 FA",

                ar: "🌐 AR"

            }[lang];


        document
            .getElementById(
                "rewardButton"
            )
            .textContent =
            t.claim;


        document
            .getElementById(
                "adsWatchedLabel"
            )
            .textContent =
            t.adsWatched;


        document
            .getElementById(
                "adsRemainingLabel"
            )
            .textContent =
            t.adsRemaining;


        document
            .getElementById(
                "adsRewardLabel"
            )
            .textContent =
            t.adsReward;


        document
            .getElementById(
                "watchAdButton"
            )
            .textContent =
            t.watchAd;


        const activeButton =
            document.querySelector(
                ".nav-button.active"
            );


        showSection(
            currentSection,
            activeButton
        );

    }


    /* =====================================================
       CHANGE LANGUAGE
    ===================================================== */

    function changeLanguage(lang) {

        localStorage.setItem(
            "language",
            lang
        );


        applyLanguage(
            lang
        );


        document
            .getElementById(
                "languageMenu"
            )
            .classList.remove(
                "show"
            );

    }


    /* =====================================================
       LANGUAGE MENU
    ===================================================== */

    function toggleLanguageMenu() {

        document
            .getElementById(
                "languageMenu"
            )
            .classList.toggle(
                "show"
            );

    }


    document.addEventListener(
        "click",
        function(event) {

            const menu =
                document.getElementById(
                    "languageMenu"
                );

            const button =
                document.getElementById(
                    "languageButton"
                );


            if (
                !menu.contains(
                    event.target
                ) &&
                !button.contains(
                    event.target
                )
            ) {

                menu.classList.remove(
                    "show"
                );

            }

        }
    );


    /* =====================================================
       DAILY REWARD CHECK
    ===================================================== */

    async function checkDailyReward() {

        if (!user) {
            return;
        }


        try {

            const response =
                await fetch(
                    "/api/user/" +
                    encodeURIComponent(
                        user.id
                    )
                );


            const data =
                await response.json();


            if (
                !data.success ||
                !data.user
            ) {

                return;

            }


            const lastReward =
                data.user.last_daily_reward;


            const button =
                document.getElementById(
                    "rewardButton"
                );


            const status =
                document.getElementById(
                    "rewardStatus"
                );


            const lang =
                localStorage.getItem(
                    "language"
                ) ||
                detectLanguage();


            const t =
                translations[lang];


            if (!lastReward) {

                button.disabled =
                    false;

                button.textContent =
                    t.claim;

                status.textContent =
                    "";

                return;

            }


            const lastTime =
                new Date(lastReward)
                    .getTime();


            const nextTime =
                lastTime +
                (12 * 60 * 60 * 1000);


            const now =
                Date.now();


            if (now >= nextTime) {

                button.disabled =
                    false;

                button.textContent =
                    t.claim;

                status.textContent =
                    "";

                return;

            }


            button.disabled =
                true;

            button.textContent =
                t.claimed;


            updateWaitingTime(
                nextTime
            );


        } catch (error) {

            console.error(
                "Daily reward check error:",
                error
            );

        }

    }


    /* =====================================================
       DAILY WAITING TIME
    ===================================================== */

    function updateWaitingTime(
        nextTime
    ) {

        const status =
            document.getElementById(
                "rewardStatus"
            );


        const lang =
            localStorage.getItem(
                "language"
            ) ||
            detectLanguage();


        const t =
            translations[lang];


        function update() {

            const remaining =
                nextTime -
                Date.now();


            if (remaining <= 0) {

                checkDailyReward();

                return;

            }


            const totalMinutes =
                Math.ceil(
                    remaining / 60000
                );


            const hours =
                Math.floor(
                    totalMinutes / 60
                );


            const minutes =
                totalMinutes % 60;


            status.className =
                "reward-status reward-waiting";


            status.textContent =
                t.waiting +
                " " +
                hours +
                "h " +
                minutes +
                "m";

        }


        update();


        setTimeout(
            function() {

                checkDailyReward();

            },
            60000
        );

    }


    /* =====================================================
       CLAIM DAILY REWARD
    ===================================================== */

    async function claimDailyReward() {

        if (!user) {
            return;
        }


        const button =
            document.getElementById(
                "rewardButton"
            );


        const status =
            document.getElementById(
                "rewardStatus"
            );


        const lang =
            localStorage.getItem(
                "language"
            ) ||
            detectLanguage();


        const t =
            translations[lang];


        button.disabled =
            true;


        try {

            const response =
                await fetch(
                    "/api/daily-reward",
                    {

                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({

                                telegram_id:
                                    user.id

                            })

                    }
                );


            const data =
                await response.json();


            if (data.success) {

                coins =
                    Number(
                        data.user.coins
                    );


                updateBalance();


                button.textContent =
                    t.claimed;


                status.className =
                    "reward-status reward-success";


                status.textContent =
                    t.congratulations;


                setTimeout(
                    function() {

                        checkDailyReward();

                    },
                    1500
                );

            } else {

                button.disabled =
                    true;

                button.textContent =
                    t.claimed;


                status.className =
                    "reward-status reward-waiting";


                if (
                    data.next_reward
                ) {

                    updateWaitingTime(
                        new Date(
                            data.next_reward
                        ).getTime()
                    );

                } else {

                    status.textContent =
                        data.message ||
                        t.error;

                }

            }


        } catch (error) {

            console.error(
                "Daily reward error:",
                error
            );


            button.disabled =
                false;


            status.className =
                "reward-status reward-error";


            status.textContent =
                t.error;

        }

    }


    /* =====================================================
       ADS STATUS
    ===================================================== */

    async function loadAdsStatus() {

        if (!user) {
            return;
        }


        try {

            const response =
                await fetch(
                    "/api/ads/status/" +
                    encodeURIComponent(
                        user.id
                    )
                );


            const data =
                await response.json();


            if (!data.success) {
                return;
            }


            document
                .getElementById(
                    "adsWatched"
                )
                .textContent =
                data.ads_watched;


            document
                .getElementById(
                    "adsLimit"
                )
                .textContent =
                data.limit;


            document
                .getElementById(
                    "adsRemaining"
                )
                .textContent =
                data.ads_remaining;


            const button =
                document.getElementById(
                    "watchAdButton"
                );


            const message =
                document.getElementById(
                    "adsMessage"
                );


            const lang =
                localStorage.getItem(
                    "language"
                ) ||
                detectLanguage();


            const t =
                translations[lang];


            if (
                data.ads_remaining <= 0
            ) {

                button.disabled =
                    true;


                message.className =
                    "ads-message ads-waiting";


                message.textContent =
                    t.adLimit +
                    " " +
                    t.adsReset +
                    " " +
                    data.hours_until_reset +
                    "h " +
                    data.minutes_until_reset +
                    "m";

            } else {

                button.disabled =
                    false;

                message.textContent =
                    "";

            }

        } catch (error) {

            console.error(
                "Ads status error:",
                error
            );

        }

    }


    /* =====================================================
       WATCH ADSGRAM AD
    ===================================================== */

    async function watchAd() {

        if (!user) {
            return;
        }


        const button =
            document.getElementById(
                "watchAdButton"
            );


        const message =
            document.getElementById(
                "adsMessage"
            );


        const lang =
            localStorage.getItem(
                "language"
            ) ||
            detectLanguage();


        const t =
            translations[lang];


        if (!AdController) {

            message.className =
                "ads-message ads-error";


            message.textContent =
                t.adError;


            return;

        }


        button.disabled =
            true;


        message.className =
            "ads-message ads-waiting";


        message.textContent =
            "⏳ Loading advertisement...";


        try {

            const result =
                await AdController.show();


            /*
             AdsGram Rewarded Ad:
             done === true means
             user watched the ad successfully.
            */

            if (
                result &&
                result.done === true
            ) {

                message.textContent =
                    "⏳ Processing reward...";


                /*
                 Ask backend to award
                 the 2,000 coins.
                */

                const response =
                    await fetch(
                        "/api/ads/claim",
                        {

                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify({

                                    telegram_id:
                                        user.id

                                })

                        }
                    );


                const data =
                    await response.json();


                if (data.success) {

                    /*
                     Update balance
                    */

                    coins =
                        Number(
                            data.user.coins
                        );


                    updateBalance();


                    message.className =
                        "ads-message ads-success";


                    message.textContent =
                        t.adSuccess;


                    document
                        .getElementById(
                            "adsWatched"
                        )
                        .textContent =
                        data.ads_watched;


                    document
                        .getElementById(
                            "adsRemaining"
                        )
                        .textContent =
                        data.ads_remaining;


                    if (
                        data.ads_remaining <= 0
                    ) {

                        button.disabled =
                            true;

                    } else {

                        button.disabled =
                            false;

                    }

                } else {

                    message.className =
                        "ads-message ads-error";


                    message.textContent =
                        data.message ||
                        t.adError;


                    await loadAdsStatus();

                }

            } else {

                /*
                 Advertisement was not
                 successfully completed.
                */

                message.className =
                    "ads-message ads-error";


                message.textContent =
                    t.adError;


                await loadAdsStatus();

            }


        } catch (error) {

            console.error(
                "AdsGram show error:",
                error
            );


            message.className =
                "ads-message ads-error";


            message.textContent =
                t.adError;


            await loadAdsStatus();

        }

    }


    /* =====================================================
       REGISTER USER
    ===================================================== */

    async function registerUser() {

        if (!user) {
            return;
        }


        const language =
            localStorage.getItem(
                "language"
            ) ||
            detectLanguage();


        try {

            const response =
                await fetch(
                    "/api/user",
                    {

                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({

                                telegram_id:
                                    user.id,

                                first_name:
                                    user.first_name ||
                                    "",

                                username:
                                    user.username ||
                                    "",

                                language:
                                    language

                            })

                    }
                );


            const data =
                await response.json();


            if (data.success) {

                console.log(
                    "EarnPool user registered:",
                    data.user
                );

            }

        } catch (error) {

            console.error(
                "User registration error:",
                error
            );

        }

    }


    /* =====================================================
       START
    ===================================================== */

    async function startUser() {

        await registerUser();

        await loadUserBalance();

        await checkDailyReward();

    }


    /* =====================================================
       INITIAL LANGUAGE
    ===================================================== */

    let savedLanguage =
        localStorage.getItem(
            "language"
        );


    if (
        !savedLanguage ||
        !translations[savedLanguage]
    ) {

        savedLanguage =
            detectLanguage();

    }


    applyLanguage(
        savedLanguage
    );


    updateBalance();


    startUser();


</script>
