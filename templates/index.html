    * {
        box-sizing: border-box;
    }

    html,
    body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100%;
        font-family: Arial, sans-serif;
        background: #10131a;
        color: white;
    }

    body {
        padding-bottom: 88px;
    }

    button {
        font-family: inherit;
    }

    .app {
        width: 100%;
        max-width: 600px;
        margin: 0 auto;
        padding: 15px;
    }

    .top-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 18px;
    }

    .logo {
        font-size: 23px;
        font-weight: bold;
    }

    .language-button {
        border: none;
        background: #1c2330;
        color: white;
        border-radius: 10px;
        padding: 8px 11px;
        font-size: 13px;
        cursor: pointer;
    }

    .language-menu {
        display: none;
        position: absolute;
        top: 58px;
        right: 15px;
        background: #1c2330;
        border-radius: 12px;
        padding: 6px;
        z-index: 100;
        box-shadow: 0 8px 25px rgba(0,0,0,.35);
    }

    .language-menu.show {
        display: block;
    }

    .language-option {
        display: block;
        width: 125px;
        border: none;
        background: transparent;
        color: white;
        padding: 10px;
        text-align: center;
        border-radius: 8px;
        cursor: pointer;
    }

    .language-option:active {
        background: #293242;
    }

    .balance-card {
        background: #191e29;
        border-radius: 20px;
        padding: 22px;
        text-align: center;
        margin-bottom: 18px;
    }

    .balance-title {
        color: #9da5b4;
        font-size: 14px;
        margin-bottom: 8px;
    }

    .coins {
        font-size: 30px;
        font-weight: bold;
    }

    .usd-value {
        margin-top: 6px;
        color: #8f98a8;
        font-size: 15px;
    }

    .content-card {
        background: #191e29;
        border-radius: 20px;
        padding: 22px;
        min-height: 330px;
    }

    .content-icon {
        font-size: 42px;
        margin-bottom: 12px;
    }

    .content-title {
        font-size: 22px;
        font-weight: bold;
        margin-bottom: 12px;
    }

    .content-text {
        color: #aeb5c1;
        line-height: 1.8;
        font-size: 15px;
    }

    .reward-button,
    .watch-ad-button {
        width: 100%;
        border: none;
        background: #2d7dff;
        color: white;
        border-radius: 14px;
        padding: 15px;
        margin-top: 18px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
    }

    .reward-button:disabled,
    .watch-ad-button:disabled {
        background: #303744;
        color: #8f98a8;
        cursor: not-allowed;
    }

    .reward-status,
    .ads-message,
    .task-message {
        text-align: center;
        margin-top: 14px;
        font-size: 14px;
        line-height: 1.6;
    }

    .reward-success,
    .ads-success,
    .task-success {
        color: #58d68d;
    }

    .reward-waiting,
    .ads-waiting {
        color: #aeb5c1;
    }

    .reward-error,
    .ads-error,
    .task-error {
        color: #ff7777;
    }

    .ads-panel {
        margin-top: 20px;
    }

    .ads-info {
        background: #111722;
        border-radius: 14px;
        padding: 14px;
        margin-top: 15px;
    }

    .ads-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 7px 0;
        color: #b5bdc9;
        font-size: 14px;
    }

    .ads-row strong {
        color: white;
    }


    /* =====================================================
       TASKS
    ===================================================== */

    .tasks-panel {
        margin-top: 20px;
    }

    .task-card {
        background: #111722;
        border-radius: 15px;
        padding: 15px;
        margin-top: 12px;
    }

    .task-title {
        font-size: 16px;
        font-weight: bold;
        margin-bottom: 7px;
    }

    .task-description {
        color: #aeb5c1;
        font-size: 13px;
        line-height: 1.6;
        margin-bottom: 10px;
    }

    .task-reward {
        color: #ffd166;
        font-weight: bold;
        font-size: 14px;
        margin-bottom: 10px;
    }

    .task-button {
        width: 100%;
        border: none;
        background: #2d7dff;
        color: white;
        border-radius: 11px;
        padding: 11px;
        font-weight: bold;
        cursor: pointer;
    }

    .task-button:disabled {
        background: #303744;
        color: #8f98a8;
    }

    .no-tasks {
        text-align: center;
        color: #8f98a8;
        padding: 25px 10px;
        line-height: 1.7;
    }


    /* =====================================================
       REFERRAL
    ===================================================== */

    .referral-panel {
        margin-top: 20px;
        width: 100%;
    }

    .referral-box {
        background: #111722;
        border-radius: 14px;
        padding: 15px;
        margin-top: 12px;
    }

    .referral-label {
        color: #aeb5c1;
        font-size: 14px;
        margin-bottom: 8px;
    }

    .referral-value {
        background: #191e29;
        border-radius: 10px;
        padding: 12px;
        word-break: break-all;
        font-size: 14px;
        color: white;
        min-height: 18px;
    }

    .referral-actions {
        display: flex;
        gap: 10px;
        margin-top: 12px;
    }

    .referral-action-button {
        flex: 1;
        border: none;
        background: #2d7dff;
        color: white;
        border-radius: 11px;
        padding: 12px 10px;
        font-size: 14px;
        font-weight: bold;
        cursor: pointer;
    }

    .referral-action-button:active {
        transform: scale(.98);
    }

    .referral-message {
        text-align: center;
        margin-top: 12px;
        font-size: 13px;
        line-height: 1.5;
    }

    .referral-success {
        color: #58d68d;
    }

    .referral-error {
        color: #ff7777;
    }

    .referral-reward-info {
        background: #191e29;
        border-radius: 10px;
        padding: 11px;
        margin-top: 12px;
        text-align: center;
        color: #ffd166;
        font-size: 14px;
        font-weight: bold;
    }


    /* =====================================================
       BOTTOM NAV
    ===================================================== */

    .bottom-nav {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        width: 100%;
        background: #151922;
        border-top: 1px solid #252b36;
        padding: 7px 4px;
        z-index: 50;
    }

    .nav-container {
        width: 100%;
        max-width: 600px;
        margin: 0 auto;
        display: flex;
        gap: 3px;
    }

    .nav-button {
        flex: 1;
        width: 16.666%;
        min-width: 0;
        border: none;
        background: transparent;
        color: #8f98a8;
        border-radius: 11px;
        padding: 6px 1px;
        cursor: pointer;
        font-size: 9px;
        line-height: 1.2;
    }

    .nav-button.active {
        background: #252d3b;
        color: white;
    }

    .nav-icon {
        display: block;
        font-size: 20px;
        line-height: 22px;
        margin-bottom: 3px;
    }

    @media (max-width: 360px) {

        .app {
            padding: 12px;

        .nav-button {
            font-size: 8px;
        }

        .nav-icon {

        }

        .logo {
            font-size: 21px;

        .coins {

<body>

<div class="app">


    <!-- =====================================================
         TOP BAR
    ====================================================== -->

    <div class="top-bar">

        <div class="logo">
            EarnPool
        </div>

        <button
            class="language-button"
            id="languageButton"
            onclick="toggleLanguageMenu()"
        >
            🌐 EN
        </button>

    </div>


    <!-- =====================================================
         LANGUAGE MENU
    ====================================================== -->

    <div
        class="language-menu"
        id="languageMenu"
    >

        <button
            class="language-option"
            onclick="changeLanguage('en')"
        >
            🇬🇧 English
        </button>

        <button
            class="language-option"
            onclick="changeLanguage('fa')"
        >
            🇦🇫 فارسی
        </button>

        <button
            class="language-option"
            onclick="changeLanguage('ar')"
        >
            🇸🇦 العربية
        </button>

    </div>


    <!-- =====================================================
         BALANCE
    ====================================================== -->

    <div class="balance-card">

        <div
            class="balance-title"
            id="balanceTitle"
        >
            Your Balance
        </div>

        <div class="coins">

            <span id="coins">0</span>

            🪙

        </div>

        <div
            class="usd-value"
            id="usdValue"
        >
            ≈ $0.000000
        </div>

    </div>


    <!-- =====================================================
         MAIN CONTENT
    ====================================================== -->

    <div class="content-card">

            class="content-icon"
            id="contentIcon"
        >
            🎁
        </div>

            id="contentTitle"
        >
            Daily Reward
        </div>

        <div
            class="content-text"
            id="contentText"
        >
            Claim your daily reward and earn coins every 12 hours.
        </div>


        <!-- =================================================
             DAILY
        ================================================== -->

        <button
            id="rewardButton"
            class="reward-button"
            onclick="claimDailyReward()"
        >
            🎁 Claim 1,000 Coins
        </button>

        <div
            id="rewardStatus"
            class="reward-status"
        ></div>


        <!-- =================================================
             ADS
        ================================================== -->

        <div
            id="adsPanel"
            class="ads-panel"
            style="display:none;"
        >

            <div class="ads-info">

                <div class="ads-row">

                    <span id="adsWatchedLabel">
                        Ads watched
                    </span>

                    <strong>

                        <span id="adsWatched">0</span>

                        /

                        <span id="adsLimit">10</span>

                    </strong>

                </div>


                <div class="ads-row">

                    <span id="adsRemainingLabel">
                        Ads remaining
                    </span>

                    <strong id="adsRemaining">
                        10
                    </strong>

                </div>


                <div class="ads-row">

                    <span id="adsRewardLabel">
                        Reward
                    </span>

                    <strong>
                        2,000 🪙
                    </strong>

                </div>

            </div>


            <button
                id="watchAdButton"
                class="watch-ad-button"
                onclick="watchAd()"
            >
                📺 Watch Ad +2,000
            </button>


            <div
                id="adsMessage"
                class="ads-message"
            ></div>

        </div>


        <!-- =================================================
             TASKS
        ================================================== -->

        <div
            id="tasksPanel"
            class="tasks-panel"
            style="display:none;"
        >

            <div id="tasksList"></div>

            <div
                id="taskMessage"
                class="task-message"
            ></div>

        </div>


        <!-- =================================================
             REFERRAL
        ================================================== -->

        <div
            id="referralPanel"
            class="referral-panel"
            style="display:none;"
        >

            <!-- Referral Link -->

            <div class="referral-box">

                <div
                    class="referral-label"
                    data-key="referralLink"
                >
                    Referral Link
                </div>

                <div
                    id="referralLink"
                    class="referral-value"
                >
                    Loading...
                </div>


                <div class="referral-actions">

                    <button
                        id="copyReferralButton"
                        class="referral-action-button"
                        onclick="copyReferralLink()"
                    >
                        📋 Copy
                    </button>

                    <button
                        id="shareReferralButton"
                        class="referral-action-button"
                        onclick="shareReferralLink()"
                    >
                        📤 Share
                    </button>

                </div>

            </div>


            <!-- Referral Count -->

            <div class="referral-box">

                <div
                    class="referral-label"
                    data-key="referralCount"
                >
                    Referrals
                </div>

                <div
                    id="referralCount"
                    class="referral-value"
                >
                    0
                </div>

            </div>


            <!-- Referral Reward -->

            <div
                class="referral-reward-info"
                id="referralRewardInfo"
            >
                🎁 5,000 🪙 per referral
            </div>


            <div
                id="referralMessage"
                class="referral-message"
            ></div>

        </div>

    </div>

</div>


<!-- =========================================================
     BOTTOM NAV
========================================================== -->

<div class="bottom-nav">

    <div class="nav-container">


        <button
            class="nav-button active"
            data-section="daily"
            onclick="showSection('daily', this)"
        >

            <span class="nav-icon">🎁</span>

            <span data-key="daily">
                Daily
            </span>

        </button>


        <button
            class="nav-button"
            data-section="ads"
            onclick="showSection('ads', this)"
        >

            <span class="nav-icon">📺</span>

            <span data-key="ads">
                Ads
            </span>

        </button>


        <button
            class="nav-button"
            data-section="tasks"
            onclick="showSection('tasks', this)"
        >

            <span class="nav-icon">🎯</span>

            <span data-key="tasks">
                Tasks
            </span>

        </button>


        <button
            class="nav-button"
            data-section="referral"
            onclick="showSection('referral', this)"
        >

            <span class="nav-icon">👥</span>

            <span data-key="referral">
                Referral
            </span>

        </button>


        <button
            class="nav-button"
            data-section="withdraw"
            onclick="showSection('withdraw', this)"
        >

            <span class="nav-icon">💰</span>

            <span data-key="withdraw">
                Withdraw
            </span>

        </button>


        <button
            class="nav-button"
            data-section="account"
            onclick="showSection('account', this)"
        >

            <span class="nav-icon">👤</span>

            <span data-key="account">
                Account
            </span>

        </button>

    </div>

</div>

/* =====================================================
   DETECT LANGUAGE
===================================================== */

function detectLanguage() {

    if (!user) {

        return "en";

    }


    const code =
        (
            user.language_code ||
            ""
        ).toLowerCase();


    if (
        code === "fa" ||
        code.startsWith("fa-")
    ) {

        return "fa";

    }


    if (
        code === "ar" ||
        code.startsWith("ar-")
    ) {

        return "ar";

    }


    return "en";

}


/* =====================================================
   GET LANGUAGE
===================================================== */

function getLanguage() {

    return (
        localStorage.getItem("language") ||
        detectLanguage()
    );

}


/* =====================================================
   APPLY LANGUAGE
===================================================== */

function applyLanguage(lang) {

    if (!translations[lang]) {

        lang = "en";

    }


    const t =
        translations[lang];


    document.documentElement.lang =
        lang;


    document.documentElement.dir =
        lang === "en"
            ? "ltr"
            : "rtl";


    document.getElementById(
        "balanceTitle"
    ).textContent =
        t.balance;


    document
        .querySelectorAll("[data-key]")
        .forEach(function(element) {

            const key =
                element.getAttribute(
                    "data-key"
                );


            if (t[key]) {

                element.textContent =
                    t[key];

            }

        });


    document.getElementById(
        "languageButton"
    ).textContent = {

        en: "🌐 EN",

        fa: "🌐 FA",

        ar: "🌐 AR"

    }[lang];


    document.getElementById(
        "rewardButton"
    ).textContent =
        t.claim;


    document.getElementById(
        "adsWatchedLabel"
    ).textContent =
        t.adsWatched;


    document.getElementById(
        "adsRemainingLabel"
    ).textContent =
        t.adsRemaining;


    document.getElementById(
        "adsRewardLabel"
    ).textContent =
        t.adsReward;


    document.getElementById(

                ).toLocaleString();

            "0";

/* =====================================================
   COPY REFERRAL LINK
===================================================== */

async function copyReferralLink() {

    const linkElement =
        document.getElementById(
            "referralLink"
        );

    const link =
        linkElement.textContent.trim();


    if (
        !link ||
        link === "Loading..." ||
        link === "Unable to load"
    ) {
        return;
    }


    try {

        await navigator.clipboard.writeText(
            link
        );

        showReferralMessage(
            "✅ Copied!"
        );

    } catch (error) {

        /*
         روش جایگزین برای بعضی
         دستگاه‌های قدیمی
        */

        try {

            const textarea =
                document.createElement(
                    "textarea"
                );

            textarea.value = link;

            document.body.appendChild(
                textarea
            );

            textarea.select();

            document.execCommand(
                "copy"
            );

            textarea.remove();

            showReferralMessage(
                "✅ Copied!"
            );

        } catch (copyError) {

            console.error(
                "Copy error:",
                copyError
            );

        }

    }

}

/* =====================================================
   DAILY REWARD CHECK
===================================================== */

async function checkDailyReward() {

    if (!user) {
        return;
    }

    try {

        const response =
            await fetch(
                "/api/user/" +
                encodeURIComponent(user.id)
            );

        const data =
            await response.json();

        if (
            !data.success ||
            !data.user
        ) {
            return;
        }


        const lastReward =
            data.user.last_daily_reward;


        const button =
            document.getElementById(
                "rewardButton"
            );

        const status =
            document.getElementById(
                "rewardStatus"
            );

        const t =
            translations[getLanguage()];


        if (!lastReward) {

            button.disabled = false;

            button.textContent =
                t.claim;

            status.textContent = "";

            return;

        }


        const lastTime =
            new Date(
                lastReward
            ).getTime();


        const nextTime =
            lastTime +
            (12 * 60 * 60 * 1000);


        const now =
            Date.now();


        if (
            now >= nextTime
        ) {

            button.disabled = false;

            button.textContent =
                t.claim;

            status.textContent = "";

            return;

        }


        button.disabled = true;

        button.textContent =
            t.claimed;


        updateWaitingTime(
            nextTime
        );


    } catch (error) {

        console.error(
            "Daily reward check error:",
            error
        );

    }

}


/* =====================================================
   DAILY WAITING TIME
===================================================== */

function updateWaitingTime(nextTime) {

    const status =
        document.getElementById(
            "rewardStatus"
        );

    const t =
        translations[getLanguage()];


    function update() {

        const remaining =
            nextTime -
            Date.now();


        if (
            remaining <= 0
        ) {

            checkDailyReward();

            return;

        }


        const totalMinutes =
            Math.ceil(
                remaining / 60000
            );


        const hours =
            Math.floor(
                totalMinutes / 60
            );


        const minutes =
            totalMinutes % 60;


        status.className =
            "reward-status reward-waiting";


        status.textContent =
            t.waiting +
            " " +
            hours +
            "h " +
            minutes +
            "m";

    }


    update();


    setTimeout(
        function() {
            checkDailyReward();
        },
        60000
    );

}


/* =====================================================
   CLAIM DAILY REWARD
===================================================== */

async function claimDailyReward() {

    if (!user) {
        return;
    }


    const button =
        document.getElementById(
            "rewardButton"
        );


    const status =
        document.getElementById(
            "rewardStatus"
        );


    const t =
        translations[getLanguage()];


    button.disabled = true;


    try {

        const response =
            await fetch(
                "/api/daily-reward",
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            telegram_id:
                                user.id

                        })

                }
            );


        const data =
            await response.json();


        if (data.success) {

            coins =
                Number(
                    data.user.coins
                );

            updateBalance();


            button.textContent =
                t.claimed;


            status.className =
                "reward-status reward-success";


            status.textContent =
                t.congratulations;


            setTimeout(
                function() {
                    checkDailyReward();
                },
                1500
            );


        } else {

            button.disabled = true;

            button.textContent =
                t.claimed;


            status.className =
                "reward-status reward-waiting";


            if (
                data.next_reward
            ) {

                updateWaitingTime(
                    new Date(
                        data.next_reward
                    ).getTime()
                );

            } else {

                status.textContent =
                    data.message ||
                    t.error;

            }

        }

    } catch (error) {

        console.error(
            "Daily reward error:",
            error
        );


        button.disabled = false;


        status.className =
            "reward-status reward-error";


        status.textContent =
            t.error;

    }

}

        ).textContent =
            data.limit;


        document.getElementById(
            "adsRemaining"
        ).textContent =
            data.ads_remaining;


        const button =
            document.getElementById(
                "watchAdButton"
            );


        const message =
            document.getElementById(
                "adsMessage"
            );


        const t =
            translations[getLanguage()];


        if (
            data.ads_remaining <= 0
        ) {

            button.disabled = true;


            message.className =
                "ads-message ads-waiting";


            message.textContent =
                t.adLimit +
                " " +
                t.adsReset +
                " " +
                (
                    data.hours_until_reset ||
                    0
                ) +
                "h " +
                (
                    data.minutes_until_reset ||
                    0
                ) +
                "m";


        } else {

            button.disabled = false;

            message.textContent = "";

        }


    } catch (error) {

        console.error(
            "Ads status error:",
            error
        );

    }

}


/* =====================================================
   WATCH ADSGRAM AD
===================================================== */

async function watchAd() {

    if (!user) {
        return;
    }


    const button =
        document.getElementById(
            "watchAdButton"
        );


    const message =
        document.getElementById(
            "adsMessage"
        );


    const t =
        translations[getLanguage()];


    if (!AdController) {

        message.className =
            "ads-message ads-error";

        message.textContent =
            t.adError;

        return;

    }


    button.disabled = true;


    message.className =
        "ads-message ads-waiting";


    message.textContent =
        "⏳ Loading advertisement...";


    try {

        const result =
            await AdController.show();


        if (
            !result ||
            result.done !== true
        ) {

            message.className =
                "ads-message ads-error";


            message.textContent =
                t.adError;


            await loadAdsStatus();

            return;

        }


        message.textContent =
            "⏳ Processing reward...";


        const response =
            await fetch(
                "/api/ads/claim",
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            telegram_id:
                                user.id

                        })

                }
            );


        const data =
            await response.json();


        if (data.success) {

            coins =
                Number(
                    data.user.coins
                );


            updateBalance();


            document.getElementById(
                "adsWatched"
            ).textContent =
                data.ads_watched;


            document.getElementById(
                "adsRemaining"
            ).textContent =
                data.ads_remaining;


            message.className =
                "ads-message ads-success";


            message.textContent =
                t.adSuccess;


            if (
                data.ads_remaining <= 0
            ) {

                button.disabled = true;

            } else {

                button.disabled = false;

            }


        } else {

            message.className =
                "ads-message ads-error";


            message.textContent =
                data.message ||
                t.adError;


            await loadAdsStatus();

        }


    } catch (error) {

        console.error(
            "AdsGram error:",
            error
        );


        message.className =
            "ads-message ads-error";


        message.textContent =
            t.adError;


        await loadAdsStatus();

    }

}


/* =====================================================
   TASKS
===================================================== */

async function loadTasks() {

    if (!user) {
        return;
    }


    const list =
        document.getElementById(
            "tasksList"
        );


    const message =
        document.getElementById(
            "taskMessage"
        );


    const t =
        translations[getLanguage()];


    list.innerHTML = "";


    message.className =
        "task-message";


    message.textContent =
        t.tasksLoading;


    try {

        const response =
            await fetch(
                "/api/tasks/available/" +
                encodeURIComponent(user.id)
            );


        const data =
            await response.json();


        if (!data.success) {

            message.className =
                "task-message task-error";


            message.textContent =
                data.message ||
                t.error;


            return;

        }


        const tasks =
            Array.isArray(data.tasks)
                ? data.tasks
                : [];


        list.innerHTML = "";


        if (
            tasks.length === 0
        ) {

            message.className =
                "task-message";


            message.textContent =
                t.noTasks;


            return;

        }


        tasks.forEach(
            function(task) {

                createTaskCard(task);

            }
        );


        message.textContent = "";


    } catch (error) {

        console.error(
            "Tasks loading error:",
            error
        );


        message.className =
            "task-message task-error";


        message.textContent =
            t.error;

    }

}


/* =====================================================
   CREATE ADSGRAM TASK CARD
===================================================== */

function createTaskCard(task) {

    const list =
        document.getElementById(
            "tasksList"
        );


    const t =
        translations[getLanguage()];


    const card =
        document.createElement(
            "div"
        );


    card.className =
        "task-card";


    const title =
        document.createElement(
            "div"
        );


    title.className =
        "task-title";


    title.textContent =
        task.title ||
        "AdsGram Task";


    const description =
        document.createElement(
            "div"
        );


    description.className =
        "task-description";


    description.textContent =
        task.description ||
        "";


    const reward =
        document.createElement(
            "div"
        );


    reward.className =
        "task-reward";


    reward.textContent =
        t.taskReward;


    const adsTask =
        document.createElement(
            "adsgram-task"
        );


    adsTask.setAttribute(
        "data-block-id",
        "task-44183"
    );


    adsTask.setAttribute(
        "data-debug",
        "false"
    );


    adsTask.setAttribute(
        "data-debug-console",
        "false"
    );


    adsTask.className =
        "task";


    let rewardSent = false;


    adsTask.addEventListener(
        "reward",
        async function() {

            if (rewardSent) {
                return;
            }


            rewardSent = true;


            await claimAdsGramTask(
                task,
                card,
                adsTask
            );

        }
    );


    adsTask.addEventListener(
        "onError",
        function(event) {

            console.error(
                "AdsGram Task error:",
                event
            );

        }
    );


    card.appendChild(title);


    if (
        task.description
    ) {

        card.appendChild(
            description
        );

    }


    card.appendChild(
        reward
    );


    card.appendChild(
        adsTask
    );


    list.appendChild(
        card
    );

}


/* =====================================================
   CLAIM ADSGRAM TASK REWARD
===================================================== */

async function claimAdsGramTask(
    task,
    card,
    adsTask
) {

    if (!user) {
        return;
    }


    if (
        !task ||
        !task.id
    ) {

        return;

    }


    const message =
        document.getElementById(
            "taskMessage"
        );


    const t =
        translations[getLanguage()];


    message.className =
        "task-message";


    message.textContent =
        "⏳ Processing reward...";


    try {

        const response =
            await fetch(
                "/api/tasks/claim",
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            telegram_id:
                                user.id,

                            task_id:
                                task.id

                        })

                }
            );


        const data =
            await response.json();


        if (
            data.success
        ) {

            coins =
                Number(
                    data.user.coins
                );


            updateBalance();


            message.className =
                "task-message task-success";


            message.textContent =
                t.taskSuccess;


            if (card) {
                card.remove();
            }


            const list =
                document.getElementById(
                    "tasksList"
                );


            if (
                !list.children.length
            ) {

                message.textContent =
                    t.noTasks;

            }


        } else {


            if (
                data.already_completed
            ) {

                if (card) {
                    card.remove();
                }


                message.className =
                    "task-message";


                message.textContent =
                    t.taskAlready;


            } else {

                message.className =
                    "task-message task-error";


                message.textContent =
                    data.message ||
                    t.error;

            }

        }


    } catch (error) {

        console.error(
            "AdsGram task claim error:",
            error
        );


        message.className =
            "task-message task-error";


        message.textContent =
            t.error;

    }

}


/* =====================================================
   START USER
===================================================== */

async function startUser() {

    await registerUser();

    await loadUserBalance();

    await checkDailyReward();

}


/* =====================================================
   INITIAL LANGUAGE
===================================================== */

let savedLanguage =
    localStorage.getItem(
        "language"
    );


if (
    !savedLanguage ||
    !translations[savedLanguage]
) {

    savedLanguage =
        detectLanguage();

}


applyLanguage(
    savedLanguage
);


updateBalance();


startUser();

</script>
